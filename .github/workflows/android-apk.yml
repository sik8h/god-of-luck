name: God of Luck Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Build Web Assets
        run: |
          npm install
          chmod +x node_modules/.bin/* || true
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize Android Capacitor Build
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "God of Luck" com.aigamestudio.godofluck --web-dir dist --yes
          npx cap add android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodOfLuck-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk